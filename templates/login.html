{% extends "base.html" %}

{% block title %}Login - CollegePay{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center">
    <div
        class="w-full max-w-5xl mx-auto grid lg:grid-cols-2 gap-0 rounded-3xl overflow-hidden glass-card animate-fade-in">

        <!-- Left: Login Form -->
        <div class="p-8 sm:p-12 flex flex-col justify-center">
            <!-- Logo -->
            <div class="flex justify-center mb-6 animate-fade-in">
                <div class="p-3 bg-accent/10 rounded-2xl">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="CollegePay"
                        class="w-12 h-12 text-accent">
                </div>
            </div>

            <h2 class="text-3xl font-extrabold text-center mb-2">Welcome to CollegePay</h2>
            <p class="text-center text-slate-500 dark:text-gray-400 mb-8">Secure Campus Finance Platform</p>

            <form method="post" class="space-y-5">
                <div>
                    <label class="input-label">Student/User ID</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-400">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" name="student_id" class="input-field pl-11" placeholder="Enter your ID"
                            required>
                    </div>
                </div>

                <div>
                    <label class="input-label">Password</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-400">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" id="login-password" class="input-field pl-11 pr-11"
                            placeholder="Enter your password" required>
                        <button type="button" onclick="togglePassword('login-password', this)"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-400 hover:text-accent transition-colors">
                            <i class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full btn-accent rounded-2xl py-4 text-base font-bold">
                    Sign In
                </button>

                <p class="text-center small-text">
                    Don't have an account?
                    <a href="{{ url_for('wallet_login') }}"
                        class="text-accent font-semibold hover:underline">Register</a>
                </p>
            </form>
        </div>

        <!-- Right: Hero Image - Fixed as per request -->
        <div class="hidden lg:block relative overflow-hidden min-h-[500px] bg-slate-100 dark:bg-[#0F1115]">
            <img src="{{ url_for('static', filename='img/login_page_image.png') }}" alt="CollegePay Identity"
                class="absolute inset-0 w-full h-full object-cover">
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
{% endblock %}
