{% extends "base.html" %}

{% block title %}Create Admin Group - CollegePay{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-2xl mx-auto">
    <div class="mb-8 text-center sm:text-left">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Create Admin Group</h1>
        <p class="text-slate-500 dark:text-gray-400">Launch a new administrative organization on CollegePay</p>
    </div>
    <div class="glass-card">
        <div class="px-6 pt-5 pb-2 flex items-center gap-3">
            <a href="{{ url_for('dashboard') }}"
                class="w-9 h-9 rounded-full bg-slate-100 dark:bg-[#2B2F3A]/60 flex items-center justify-center text-slate-500 dark:text-gray-400 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors no-underline">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <h3 class="font-bold text-lg text-slate-800 dark:text-white">Create Group (Admin)</h3>
        </div>
        <div class="p-6">
            <form method="post" class="space-y-4">
                <div>
                    <label class="input-label">Group Name</label>
                    <input type="text" name="name" class="input-field" placeholder="e.g. Robotics Club Core Team"
                        required>
                </div>
                <div>
                    <label class="input-label">Description</label>
                    <textarea name="description" class="input-field resize-none" rows="3"
                        placeholder="Purpose of this group..."></textarea>
                </div>
                <div>
                    <label class="input-label">Category</label>
                    <select name="category" class="input-field">
                        <option value="Academic">Academic Project</option>
                        <option value="Club">Student Club</option>
                        <option value="Event">Event Committee</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="input-label">Add Members <span
                            class="font-normal text-slate-400 dark:text-gray-400">(Select from list)</span></label>
                    <div
                        class="rounded-xl bg-slate-50 dark:bg-[#1C1F2B]/40 border border-slate-200 dark:border-[#2B2F3A] max-h-48 overflow-y-auto p-2 space-y-1">
                        {% for user in users %}
                        <label
                            class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-[#1C1F2B]/80 cursor-pointer transition-colors">
                            <input class="rounded border-slate-300 dark:border-white/20 text-accent focus:ring-accent"
                                type="checkbox" name="members" value="{{ user['id'] }}" id="user{{ user['id'] }}">
                            <span class="text-sm text-slate-700 dark:text-gray-200">{{ user['name'] }}</span>
                            <span class="text-xs text-slate-400 dark:text-gray-400">({{ user['student_id'] }})</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                <div class="flex flex-col gap-2 pt-2">
                    <button type="submit" class="w-full py-3 rounded-xl font-semibold text-sm text-white transition-all"
                        style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16,185,129,0.3);">
                        Create Group & Assign
                    </button>
                    <a href="{{ url_for('dashboard') }}"
                        class="w-full py-2.5 text-center rounded-xl text-sm text-slate-500 dark:text-gray-400 bg-slate-100 dark:bg-[#1C1F2B]/80 hover:bg-slate-200 dark:hover:bg-white/[0.08] transition-all no-underline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
