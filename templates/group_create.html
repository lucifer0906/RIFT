{% extends "base.html" %}

{% block title %}Create Group - CollegePay{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-lg mx-auto">
    <div class="glass-card">
        <div class="p-6 text-center mb-2">
            <div class="icon-ring mx-auto mb-3 w-16 h-16 rounded-2xl bg-emerald-500/10">
                <i class="fas fa-users-cog text-2xl text-emerald-400"></i>
            </div>
            <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-1">Start a New Group</h3>
            <p class="text-sm text-slate-400 dark:text-gray-400">Create a collaborative space for your team.</p>
        </div>
        <div class="px-6 pb-6">
            <form method="post" class="space-y-4">
                <div class="flex flex-col text-left">
                    <label class="input-label">Group Name</label>
                    <input type="text" name="name" class="input-field" placeholder="Project Alpha" required>
                </div>
                <div class="flex flex-col text-left">
                    <label class="input-label">Description</label>
                    <textarea name="description" class="input-field resize-none" rows="3"
                        placeholder="What will this group work on?"></textarea>
                </div>
                <div class="flex flex-col text-left">
                    <label class="input-label">Category</label>
                    <input type="text" name="category" class="input-field"
                        placeholder="e.g. Study Group, Hackathon Team">
                </div>
                <div class="flex flex-col gap-2 pt-2">
                    <button type="submit" class="w-full btn-accent rounded-xl py-3 text-sm">Create Group</button>
                    <a href="{{ url_for('dashboard') }}"
                        class="w-full py-2.5 text-center rounded-xl text-sm text-slate-500 dark:text-gray-400 bg-slate-100 dark:bg-[#1C1F2B]/80 hover:bg-slate-200 dark:hover:bg-white/[0.08] transition-all no-underline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
