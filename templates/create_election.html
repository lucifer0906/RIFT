{% extends "base.html" %}

{% block title %}Create Election - CollegePay{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Create Election</h1>
        <p class="text-slate-500 dark:text-gray-400">Launch a secure on-chain vote on CollegePay</p>
    </div>
    <div class="glass-card">
        <div class="px-6 pt-5 pb-2 flex items-center gap-3">
            <a href="{{ url_for('dashboard') }}"
                class="w-9 h-9 rounded-full bg-slate-100 dark:bg-[#2B2F3A]/60 flex items-center justify-center text-slate-500 dark:text-gray-400 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors no-underline">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <h3 class="font-bold text-lg text-slate-800 dark:text-white">Create New Election</h3>
        </div>
        <div class="p-6">
            <form method="post" class="space-y-4">
                <div>
                    <label class="input-label">Election Title</label>
                    <input type="text" name="title" class="input-field"
                        placeholder="e.g. Student Council President 2024" required>
                </div>
                <div>
                    <label class="input-label">Description</label>
                    <textarea name="description" class="input-field resize-none" rows="3"
                        placeholder="Brief description of the election..."></textarea>
                </div>
                <div>
                    <label class="input-label">Candidates <span
                            class="font-normal text-slate-400 dark:text-gray-400">(One name per line)</span></label>
                    <div
                        class="rounded-xl bg-slate-50 dark:bg-[#1C1F2B]/40 border border-slate-200 dark:border-[#2B2F3A] p-3">
                        <textarea name="candidates"
                            class="w-full bg-transparent text-sm text-slate-700 dark:text-gray-200 outline-none resize-none"
                            rows="6" placeholder="Alice Smith&#10;Bob Jones&#10;Charlie Brown" required></textarea>
                    </div>
                    <p class="text-xs text-slate-400 dark:text-gray-400 mt-1.5"><i
                            class="fas fa-info-circle mr-1"></i>Each line will be registered as a separate candidate.
                    </p>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <a href="{{ url_for('dashboard') }}"
                        class="px-5 py-2.5 rounded-xl text-sm text-slate-500 dark:text-gray-400 bg-slate-100 dark:bg-[#1C1F2B]/80 hover:bg-slate-200 dark:hover:bg-white/[0.08] transition-all no-underline">Cancel</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white transition-all"
                        style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16,185,129,0.3);">
                        Create Election
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
